name: CI(Continuous Integration)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
      
    defaults:
      run:
        working-directory: ./backend/lafam
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
        cache: "maven"

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw
      
    - name: Run Backend Tests
      run: ./mvnw test
    
  frontend-ci:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend/lafam-web
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: ./frontend/lafam-web/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Run Next.js Lint
      run: npm run lint
      
    - name: Build Next.js App
      run: npm run build

      
      