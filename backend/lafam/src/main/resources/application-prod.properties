spring.application.name=lafam

# Database Configuration (Production DB from Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration (Optimized for Production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Security
spring.security.jwt.secret=${JWT_SECRET}
spring.security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
spring.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS & Cookie Security (Enforce Secure Cookies in Prod)
spring.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.auth.cookie-domain=${COOKIE_DOMAIN:}
app.auth.refresh-cookie.secure=${COOKIE_SECURE:true}

# Cloudflare R2 Object Storage
app.r2.account-id=${R2_ACCOUNT_ID}
app.r2.access-key=${R2_ACCESS_KEY}
app.r2.secret-key=${R2_SECRET_KEY}
app.r2.bucket-name=${R2_BUCKET_NAME}
app.r2.public-url=${R2_PUBLIC_URL}

# Cloudflare Turnstile CAPTCHA
cloudflare.turnstile.secret-key=${TURNSTILE_SECRET_KEY}

# Resend Email Service & Frontend Integration
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}
app.frontend-url=${DOMAIN_URL}

# Reverse Proxy / SSL Termination Header Handling
server.forward-headers-strategy=framework

# Rate Limiting Configuration
rate-limit.login.capacity=5
rate-limit.login.refill-minutes=1

rate-limit.register.capacity=5
rate-limit.register.refill-minutes=1

rate-limit.forgot-password.capacity=3
rate-limit.forgot-password.refill-minutes=1

rate-limit.reset-password.capacity=3
rate-limit.reset-password.refill-minutes=1

rate-limit-create-group.capacity=10
rate-limit-create-group.refill-minutes=1

rate-limit-invite-group.capacity=10
rate-limit-invite-group.refill-minutes=1

rate-limit-bill-create.capacity=30
rate-limit-bill-create.refill-minutes=1

rate-limit-global.capacity=100
rate-limit-global.refill-minutes=1

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
