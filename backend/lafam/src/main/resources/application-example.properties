# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/your_db
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql: true
spring.jpa.properties.hibernate.format_sql: true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT
spring.security.jwt.secret=
spring.security.jwt.access-token-expiration=
spring.security.jwt.refresh-token-expiration=

#Cors
spring.cors.allowed-origins=

# Set false only for local HTTP development. Keep true in deployed environments.
app.auth.refresh-cookie.secure=false

